name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cloudfly/persistence run prisma:generate

      - name: Build Packages in Dependency Order
        run: |
          pnpm --filter @cloudfly/contracts run build
          pnpm --filter @cloudfly/domain run build
          pnpm --filter @cloudfly/deployment-adapters run build
          pnpm --filter @cloudfly/persistence run build
          pnpm --filter @cloudfly/api run build

      - name: Run Tests
        run: pnpm test
