services:
  postgres:
    image: postgres:16-alpine
    container_name: velupi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velupi_production}
      POSTGRES_USER: ${POSTGRES_USER:-velupi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velupi_secure_pass_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velupi_user} -d ${POSTGRES_DB:-velupi_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: velupi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/cloudfly2026-byte/velupi-api:latest}
    container_name: velupi-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-velupi_user}:${POSTGRES_PASSWORD:-velupi_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-velupi_production}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INITIAL_NODE_IP: 169.58.220.244
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/cloudfly2026-byte/velupi-web:latest}
    container_name: velupi-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://169.58.220.244:4000}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
