services:
  traefik:
    image: traefik:latest
    container_name: velupi-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@velupi.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certificates:/letsencrypt

  portainer:
    image: portainer/portainer-ce:latest
    container_name: velupi-portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.velupi.com`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  postgres:
    image: postgres:16-alpine
    container_name: velupi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velupi_production}
      POSTGRES_USER: ${POSTGRES_USER:-velupi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velupi_secure_pass_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velupi_user} -d ${POSTGRES_DB:-velupi_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: velupi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/cloudfly2026-byte/velupi-api:latest}
    container_name: velupi-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.velupi-api.rule=Host(`api.velupi.com`)"
      - "traefik.http.routers.velupi-api.entrypoints=websecure"
      - "traefik.http.routers.velupi-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.velupi-api.loadbalancer.server.port=4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-velupi_user}:${POSTGRES_PASSWORD:-velupi_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-velupi_production}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INITIAL_NODE_IP: 169.58.220.244
      HESTIA_HOST: ${HESTIA_HOST:-89.117.147.134}
      HESTIA_PORT: ${HESTIA_PORT:-8083}
      HESTIA_API_USER: ${HESTIA_API_USER:-manager}
      HESTIA_ACCESS_KEY: ${HESTIA_ACCESS_KEY:-k4HHLIiCDxj9pIf1QwQK}
      HESTIA_SECRET_KEY: ${HESTIA_SECRET_KEY:-y63wRUHzKpr8hdOSuHe6CPLYKGJsXHjMWrv6t86i}
      HESTIA_READ_ONLY: ${HESTIA_READ_ONLY:-true}
      HESTIA_ALLOW_SELF_SIGNED: ${HESTIA_ALLOW_SELF_SIGNED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/cloudfly2026-byte/velupi-web:latest}
    container_name: velupi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.velupi-web.rule=Host(`app.velupi.com`)"
      - "traefik.http.routers.velupi-web.entrypoints=websecure"
      - "traefik.http.routers.velupi-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.velupi-web.loadbalancer.server.port=3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.velupi.com}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  traefik_certificates:
  portainer_data:
